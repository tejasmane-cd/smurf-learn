name: Deploy to EKS with Rollback

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
          - status

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: beautiful-pop-walrus  # Your actual cluster
  APP_NAME: simple-app
  NAMESPACE: default
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${GITHUB_RUN_NUMBER}.$(date +%s)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DOCKER_REGISTRY/$DOCKER_IMAGE:$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'rollback' && github.event.inputs.action != 'status'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ needs.version.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'rollback' && github.event.inputs.action != 'status'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Smurf
        uses: clouddrove/smurf@v1.1.9

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Create Helm chart
        run: |
          mkdir -p helm/${{ env.APP_NAME }}/templates
          
          # Chart.yaml
          cat > helm/${{ env.APP_NAME }}/Chart.yaml <<'EOF'
          apiVersion: v2
          name: simple-app
          version: "0.1.0"
          appVersion: "${{ needs.version.outputs.version }}"
          EOF

          # values.yaml
          cat > helm/${{ env.APP_NAME }}/values.yaml <<'EOF'
          replicaCount: 2
          image:
            repository: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
            tag: "${{ needs.version.outputs.version }}"
          env:
            APP_VERSION: "${{ needs.version.outputs.version }}"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          EOF

          # Deployment template
          cat > helm/${{ env.APP_NAME }}/templates/deployment.yaml <<'DEPLOYMENT'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Chart.Name }}
            labels:
              app: {{ .Chart.Name }}
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/managed-by: {{ .Release.Service }}
              version: "{{ .Chart.AppVersion }}"
          spec:
            replicas: {{ .Values.replicaCount }}
            selector:
              matchLabels:
                app: {{ .Chart.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Chart.Name }}
                  app.kubernetes.io/name: {{ .Chart.Name }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
              spec:
                containers:
                - name: {{ .Chart.Name }}
                  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 8080
                  env:
                  - name: APP_VERSION
                    value: "{{ .Values.env.APP_VERSION }}"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  resources:
                    limits:
                      cpu: "250m"
                      memory: "256Mi"
                    requests:
                      cpu: "100m"
                      memory: "128Mi"
          DEPLOYMENT

          # Service template
          cat > helm/${{ env.APP_NAME }}/templates/service.yaml <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ .Chart.Name }}
            labels:
              app: {{ .Chart.Name }}
          spec:
            type: ClusterIP
            ports:
            - port: 80
              targetPort: 8080
              protocol: TCP
            selector:
              app: {{ .Chart.Name }}
          EOF

      - name: Deploy with Smurf Helm
        run: |
          smurf selm upgrade --install ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout=300

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          
          echo -e "\n=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }}
          
          echo -e "\n=== Service ==="
          kubectl get svc ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}

      - name: Run health check
        run: |
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o jsonpath='{.items[0].metadata.name}')
          echo "Testing pod: $POD"
          
          if ! kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/health | jq .; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Save deployment info
        if: success()
        run: |
          cat > deployment-info.txt <<EOF
          Deployment: ${{ env.APP_NAME }}
          Version: ${{ needs.version.outputs.version }}
          Image: ${{ needs.version.outputs.tag }}
          Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Namespace: ${{ env.NAMESPACE }}
          Cluster: ${{ env.EKS_CLUSTER }}
          EOF
          cat deployment-info.txt

  smoke-tests:
    needs: [deploy, version]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Run smoke tests
        run: |
          echo "=== Running Smoke Tests for ${{ env.EKS_CLUSTER }} ==="
          
          # Wait for pod to be ready
          kubectl wait --for=condition=ready pod \
            -l app=${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=60s

          # Get pod name
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o jsonpath='{.items[0].metadata.name}')
          
          # Test 1: Health endpoint
          echo "Test 1: Health endpoint"
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/health
          
          # Test 2: Ready endpoint
          echo -e "\nTest 2: Ready endpoint"
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/ready
          
          # Test 3: Version endpoint
          echo -e "\nTest 3: Version endpoint"
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/version
          
          # Test 4: Main app endpoint
          echo -e "\nTest 4: App endpoint"
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/

          # Intentionally fail to verify rollback is triggered
          echo -e "\nTest 5: Intentional failure trigger"
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- curl -sf http://localhost:8080/fail || exit 1

      - name: Rollback on test failure
        if: failure()
        run: |
          echo "❌ Smoke tests failed, initiating rollback..."
          kubectl rollout undo deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m
          exit 1

  rollback:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Perform rollback
        run: |
          echo "=== Rolling back ${{ env.APP_NAME }} on ${{ env.EKS_CLUSTER }} ==="
          
          kubectl rollout history deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          
          kubectl rollout undo deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m
          
          echo "✅ Rollback complete"
          kubectl get deployment ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}

  status:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'status'
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Show deployment status
        run: |
          echo "=== Cluster: ${{ env.EKS_CLUSTER }} (Region: ${{ env.AWS_REGION }}) ==="
          
          echo -e "\n=== Deployment Status ==="
          kubectl get deployment ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} -o wide
          
          echo -e "\n=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o wide
          
          echo -e "\n=== Rollout History ==="
          kubectl rollout history deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          
          echo -e "\n=== Recent Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -10
